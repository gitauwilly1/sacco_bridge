services:
  - type: web
    name: sacco-bridge-api
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
      python manage.py create_roles
      python manage.py create_notification_templates
      python manage.py create_admin
    startCommand: |
      celery -A sacco_bridge worker -l info -Q celery,settlements,analytics,maintenance,notifications,payments --concurrency=1 --detach &
      gunicorn sacco_bridge.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: sacco_bridge.settings.production
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: sacco-bridge-db-v2
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sacco-bridge-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        value: redis://sacco-bridge-redis:6379/1
      - key: CELERY_RESULT_BACKEND
        value: redis://sacco-bridge-redis:6379/2
      - key: SECRET_KEY
        value: your-generated-secret-key
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: FRONTEND_URL
        value: https://app.sacco-bridge.onrender.com
      - key: DEFAULT_FROM_EMAIL
        value: noreply@saccobridge.co.ke
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: ENCRYPTION_KEY
        value: your-generated-encryption-key
      - key: ADMIN_EMAIL
        value: admin@saccobridge.co.ke
      - key: ADMIN_PASSWORD
        value: AdminPass@2026
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: SENTRY_DSN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_PATH
        value: credentials/firebase-credentials.json

  - type: redis
    name: sacco-bridge-redis
    plan: free
    ipAllowList: []

databases:
  - name: sacco-bridge-db-v2
    plan: free