version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: sacco_bridge_db
    environment:
      POSTGRES_DB: sacco_bridge_db
      POSTGRES_USER: sacco_bridge_user
      POSTGRES_PASSWORD: sacco_bridge_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sacco_bridge_user -d sacco_bridge_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sacco_network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: sacco_bridge_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sacco_network

  # Django Application (Gunicorn)
  app:
    build: .
    container_name: sacco_bridge_app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py create_roles &&
             python manage.py create_notification_templates &&
             gunicorn sacco_bridge.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    environment:
      - DJANGO_SETTINGS_MODULE=sacco_bridge.settings
      - DATABASE_URL=postgres://sacco_bridge_user:sacco_bridge_password@db:5432/sacco_bridge_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sacco_network
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build: .
    container_name: sacco_bridge_worker
    command: celery -A sacco_bridge worker -l info -Q celery,settlements,analytics,maintenance,notifications,payments
    environment:
      - DJANGO_SETTINGS_MODULE=sacco_bridge.settings
      - DATABASE_URL=postgres://sacco_bridge_user:sacco_bridge_password@db:5432/sacco_bridge_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sacco_network
    restart: unless-stopped

  # Celery Beat Scheduler
  celery_beat:
    build: .
    container_name: sacco_bridge_beat
    command: celery -A sacco_bridge beat -l info
    environment:
      - DJANGO_SETTINGS_MODULE=sacco_bridge.settings
      - DATABASE_URL=postgres://sacco_bridge_user:sacco_bridge_password@db:5432/sacco_bridge_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sacco_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  sacco_network:
    driver: bridge