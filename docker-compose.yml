  app:
    build: .
    container_name: sacco_bridge_app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py create_roles &&
             python manage.py create_notification_templates &&
             gunicorn sacco_bridge.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    environment:
      - DJANGO_SETTINGS_MODULE=sacco_bridge.settings
      - DATABASE_URL=postgres://sacco_bridge_user:sacco_bridge_password@db:5432/sacco_bridge_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - sacco_network
    restart: unless-stopped